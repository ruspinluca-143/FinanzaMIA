name: Prezzi e pubblicazione
on:
  schedule:
    - cron: '23 5,7 * * *'
    - cron: '53 16,18,20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/index.html', 'site/manifest.webmanifest', 'watchlist-pubblica.json', 'aggiorna-prezzi.ps1', 'raccogli-mercati.ps1', 'notifica.ps1', 'aziende.ps1', 'aziende-lista.json', '.github/workflows/prezzi.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  prezzi:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Tieni attivo il salvataggio online (un progetto Supabase gratuito si sospende dopo 7 giorni senza uso)
        continue-on-error: true
        run: |
          curl -s -m 20 -X POST "https://ktjuglujopxalzbbrehw.supabase.co/rest/v1/rpc/finanze_stato" -H "apikey: sb_publishable_0jAhFRNGuE3GjX2R_dN2FQ_M2BkVUIL" -H "Content-Type: application/json" -d "{}"
      - name: Leggi i prezzi pubblici
        id: leggi
        continue-on-error: true
        shell: pwsh
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: ./aggiorna-prezzi.ps1 -Watchlist ./watchlist-pubblica.json -Uscita ./site
      - name: Leggi i mercati (notizie e dati pubblici)
        id: mercati
        continue-on-error: true
        shell: pwsh
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: ./raccogli-mercati.ps1 -Uscita ./site
      - name: Grandi aziende USA che scendono di piu (serve il segreto FINNHUB_KEY)
        id: aziende
        continue-on-error: true
        shell: pwsh
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: ./aziende.ps1 -Uscita ./site
      - name: Avviso se i mercati non si leggono
        if: steps.mercati.outcome == 'failure'
        run: echo "::warning::Nessuna fonte dei mercati si e letta. Il sito resta con l'ultimo file buono."
      - name: Avviso se troppi prezzi non si leggono
        if: steps.leggi.outcome == 'failure'
        run: echo "::warning::Piu della meta dei prezzi non si e letta (un sito potrebbe rifiutare il data center). Il sito resta con gli ultimi prezzi buoni."
      - name: Manda il recap sul telefono (se hai impostato NTFY_TOPIC)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        shell: pwsh
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: ./notifica.ps1 -Sito ./site
      - name: Salva prezzi e storico nel repository
        run: |
          rm -f site/aggiorna-prezzi.log
          git config user.name "prezzi-bot"
          git config user.email "prezzi-bot@users.noreply.github.com"
          git add -A site
          git diff --cached --quiet || git commit -m "Prezzi del $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5