name: Analisi giornaliera nel cloud
on:
  schedule:
    - cron: '40 6 * * *'
    - cron: '40 9 * * *'
  workflow_dispatch:
    inputs:
      forza:
        description: "Riscrivi l'analisi anche se quella di oggi c'e' gia'"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: analisi-cloud
  cancel-in-progress: false
jobs:
  analisi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Leggi i dati dei mercati
        continue-on-error: true
        shell: pwsh
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: ./raccogli-mercati.ps1 -Uscita ./site
      - name: Scrivi l'analisi con Gemini
        shell: pwsh
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          FORZA: ${{ inputs.forza }}
        run: |
          if ($env:FORZA -eq 'true') { ./analisi-cloud.ps1 -Uscita ./site -Watch ./watchlist-pubblica.json -Forza }
          else { ./analisi-cloud.ps1 -Uscita ./site -Watch ./watchlist-pubblica.json }
      - name: Salva l'analisi e pubblica il sito
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "analisi-bot"
          git config user.email "analisi-bot@users.noreply.github.com"
          git add site/analisi.json
          if git diff --cached --quiet; then echo "Niente di nuovo da salvare."; exit 0; fi
          git commit -m "Analisi del $(date -u '+%Y-%m-%d') (cloud)"
          git checkout -- .          # i file letti da raccogli-mercati cambiano solo qui sul server: si buttano, altrimenti il pull --rebase si rifiuta
          ok=0
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin main && git push; then ok=1; break; fi
            sleep $((i*20))
          done
          if [ "$ok" != 1 ]; then echo "Non sono riuscito a salvare l'analisi su GitHub."; exit 1; fi
          gh workflow run prezzi.yml --ref main
