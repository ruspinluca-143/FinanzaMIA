  if (UI.dim === 'inst' && rows.length >= 3 && total > 0) { const t3 = rows.slice(0, 3).reduce((t, r) => t + r[1], 0) / total; el.append(h('p', { class: 'muted' }, 'Concentrazione: le prime 3 posizioni valgono il ' + pct(t3) + ' del patrimonio.')); }
  el.append(h('p', { class: 'muted' }, 'Le percentuali per classe e area usano la composizione che hai scritto nella scheda di ogni strumento (es. "Azioni 60, Obbligazioni 40"). Se manca, lo strumento conta al 100% nella voce indicata.'));
  if (UI.dim === 'class' && !tgt) el.append(h('p', { class: 'muted' }, 'Per vedere lo scostamento dall\'obiettivo, imposta l\'allocazione obiettivo in "Dati e sicurezza".'));

}

function tabScenari() {
  if (!S.accounts.length) return h('section', { class: 'card' }, h('p', { class: 'muted' }, 'Aggiungi conti e posizioni per simulare scenari.'));
  if (!UI.shock) applyPreset('ribasso');
  const chips = h('div', { class: 'chips', role: 'group', 'aria-label': 'Scenario' }, Object.entries(PRESETS).map(([k, P]) => h('button', { class: 'chip', 'aria-pressed': UI.scen === k ? 'true' : 'false', onclick: () => { applyPreset(k); render(); } }, P.label)));
  const inp = (get, set) => h('input', { type: 'number', step: 'any', class: 'pin', value: +(get() * 100).toFixed(2), onchange: e => { const v = parseFloat(e.target.value); set(isNaN(v) ? 0 : v / 100); render(); } });
  const crow = exposure('class').map(([lab, v]) => [lab, eur(v), inp(() => UI.shock.cls[lab.toLowerCase()] || 0, x => { UI.shock.cls[lab.toLowerCase()] = x; UI.scen = null; })]);
  const frow = exposure('ccy').filter(([c]) => c !== 'EUR').map(([c, v]) => [c + ' contro EUR', eur(v), inp(() => UI.shock.fx[c] || 0, x => { UI.shock.fx[c] = x; UI.scen = null; })]);
  const res = runScenario(), tot = res.reduce((t, r) => t + r.val, 0), dt = res.reduce((t, r) => t + r.d, 0);
  const drows = res.filter(r => r.val).map(r => [r.a.name, eur(r.val), gl(r.d, seur(r.d)), r.val ? spct(r.d / r.val) : '—']);
  drows.push([h('b', null, 'Totale'), h('b', null, eur(tot)), gl(dt, seur(dt)), tot ? spct(dt / tot) : '—']);
  const el = h('div');
  el.append(h('section', { class: 'card' }, h('h2', null, 'Scenari di stress'), h('p', { class: 'muted' }, 'Che effetto avrebbe uno shock sul tuo portafoglio di oggi? Scegli uno scenario o modifica le variazioni. Sono ipotesi, non previsioni.'), chips,
    h('div', { class: 'two' }, h('div', null, h('h3', null, 'Variazione per classe'), table([{ t: 'Classe' }, { t: 'Valore', n: 1 }, { t: 'Variazione %', n: 1 }], crow)),
      h('div', null, h('h3', null, 'Cambio'), frow.length ? table([{ t: 'Valuta' }, { t: 'Esposizione', n: 1 }, { t: 'Variazione %', n: 1 }], frow) : h('p', { class: 'muted' }, 'Nessuna esposizione in valute diverse dall\'euro.')))));
  el.append(h('section', { class: 'card' }, h('h2', null, 'Impatto'), table([{ t: 'Conto' }, { t: 'Valore oggi', n: 1 }, { t: 'Impatto', n: 1 }, { t: '%', n: 1 }], drows)));
  const ml = parseFloat(String(S.policy.maxLoss).replace(',', '.'));
  if (ml > 0 && tot > 0 && dt / tot < -ml / 100) el.append(h('div', { class: 'warn' }, 'Questo scenario supera la perdita massima che ti sei dato (' + ml + '%): ' + spct(dt / tot) + ' sul patrimonio.'));
  el.append(h('p', { class: 'muted' }, 'Volatilità, drawdown e simulazioni sui prezzi storici arriveranno quando l\'archivio avrà abbastanza storia di prezzi: l\'app la raccoglie già a ogni aggiornamento.'));
  return el;
}

/* ---- riepilogo anonimizzato per l'AI ---- */
function buildSummary(o) {
  const L = [], tot = totalValue(), sh = v => tot > 0 ? pct(v / tot) : '—', am = v => o.amounts ? ' (' + nf0.format(v) + ' €)' : '';
  L.push('Sei un analista finanziario prudente. Ti passo il riepilogo anonimizzato del mio portafoglio personale. I numeri sono già calcolati: non rifarli e non inventare dati mancanti. Rispondi in italiano, in modo concreto: cosa noti su concentrazione, rischio di cambio, costi e coerenza con la mia politica di investimento; quali domande dovrei pormi; quali alternative valutare. Non è una raccomandazione personalizzata: indica ipotesi e incertezze.', '');
  L.push('Data: ' + fmtDate(today()) + '. Valuta: EUR. Importi assoluti: ' + (o.amounts ? 'inclusi' : 'non inclusi (solo percentuali)') + '.', '');
  for (const [k, t] of [['class', 'Allocazione per classe'], ['area', 'Allocazione per area'], ['ccy', 'Allocazione per valuta']]) L.push(t + ': ' + exposure(k).map(([l, v]) => l + ' ' + sh(v) + am(v)).join('; ') + '.');
  L.push('', 'Conti:');
  S.accounts.forEach((a, n) => { const p = perfOf([a]), v = accValue(a); L.push('- ' + (o.accNames ? a.name : 'Conto ' + (n + 1)) + ' [' + (TYPES[a.type] ? TYPES[a.type].label : a.type) + ']: ' + sh(v) + ' del patrimonio' + am(v) + (a.perf && p.pnlPct != null ? '; guadagno sul versato ' + spct(p.pnlPct) : '') + (a.perf && p.xirr != null ? '; rendimento annualizzato ' + spct(p.xirr) : '') + '.'); });
  const pos = []; S.accounts.forEach(a => a.positions.forEach(p => { const i = inst(p.instId); if (i) pos.push({ i, v: posValue(p), cost: p.cost }); }));
  const agg = new Map(); pos.forEach(x => { const e = agg.get(x.i.id) || { i: x.i, v: 0, cost: 0 }; e.v += x.v; e.cost += x.cost; agg.set(x.i.id, e); });
  const top = [...agg.values()].sort((a, b) => b.v - a.v);
  L.push('', 'Posizioni principali (per peso):');
  top.slice(0, 10).forEach((x, n) => L.push('- ' + (o.instNames ? x.i.name : 'Strumento ' + (n + 1)) + ' [' + mixStr(parseMix(x.i.cls, 'n.d.')) + '; ' + mixStr(parseMix(x.i.area, 'n.d.')) + '; ' + x.i.ccy + ']: ' + sh(x.v) + am(x.v) + (x.cost > 0 ? '; guadagno non realizzato ' + spct((x.v - x.cost) / x.cost) : '') + '.'));
  if (tot > 0 && top.length >= 3) L.push('Le prime 3 posizioni valgono il ' + pct(top.slice(0, 3).reduce((t, x) => t + x.v, 0) / tot) + ' del patrimonio.');
  const tp = perfOf(S.accounts.filter(a => a.perf)); if (tp.has) L.push('', 'Conti d\'investimento nel complesso: guadagno sul versato ' + spct(tp.pnlPct) + '; rendimento annualizzato ' + spct(tp.xirr) + '.');
  const po = S.policy, pl = []; if (po.horizon) pl.push('orizzonte ' + po.horizon + ' anni'); if (po.maxLoss) pl.push('perdita massima tollerabile ' + po.maxLoss + '%'); if (po.target.trim()) pl.push('allocazione obiettivo per classe: ' + po.target); if (po.notes) pl.push(po.notes);
  L.push('', 'Mia politica di investimento: ' + (pl.length ? pl.join('; ') + '.' : 'non ancora definita.'));
  if (o.q) L.push('', 'La mia domanda: ' + o.q);
  return L.join('\n');
}

function tabDati() {
  const el = h('div');

    h('p', { class: 'muted' }, 'Fotografa i valori di oggi. Fallo dopo ogni aggiornamento dei prezzi: la storia non si può ricostruire in seguito.'),

  el.append(h('section', { class: 'card' }, h('h2', null, 'Politica di investimento'), h('p', { class: 'muted' }, 'Facoltativa e modificabile quando vuoi. Serve a confrontare il portafoglio con i tuoi obiettivi.'),
    btn('Modifica politica', () => form('Politica di investimento', [
      { key: 'horizon', label: 'Orizzonte temporale (anni)', ph: 'es. 20' },

    h('p', null, po.horizon || po.maxLoss || po.target || po.notes ? 'Orizzonte: ' + (po.horizon || '—') + ' anni · Perdita massima: ' + (po.maxLoss ? po.maxLoss + '%' : '—') + ' · Obiettivo: ' + (po.target || '—') + (po.notes ? ' · ' + po.notes : '') : 'Non ancora definita.')));
  const O = UI.sum, ta = h('textarea', { rows: 14, 'aria-label': 'Riepilogo per l\'AI' }), regen = () => { ta.value = buildSummary(O); };
  const chk = (key, label) => h('label', { class: 'chk' }, h('input', { type: 'checkbox', checked: O[key], onchange: e => { O[key] = e.target.checked; regen(); } }), h('span', null, label));
  const qi = h('input', { type: 'text', value: O.q, placeholder: 'es. Il mio portafoglio è troppo concentrato?', style: 'width:100%', oninput: e => { O.q = e.target.value; regen(); } });
  const cp = h('span', { class: 'muted' }, ''); regen();
  el.append(h('section', { class: 'card' }, h('h2', null, 'Chiedi all\'AI (senza collegamenti)'), h('p', { class: 'muted' }, 'L\'app non si collega a nessuna AI. Prepara un riepilogo anonimizzato: leggilo, correggilo se vuoi, copialo e incollalo tu in una chat con Claude.'),
    chk('amounts', 'Includi gli importi in euro (di base solo percentuali)'), chk('accNames', 'Includi i nomi dei conti (di base "Conto 1", "Conto 2"…)'), chk('instNames', 'Includi i nomi degli strumenti (servono per un\'analisi utile)'),
    h('label', { class: 'fld' }, h('span', null, 'La tua domanda'), qi), ta,
    h('div', { class: 'row', style: 'margin-top:8px' }, btn('Copia il riepilogo', async () => { try { await navigator.clipboard.writeText(ta.value); } catch { ta.select(); document.execCommand('copy'); } cp.textContent = 'Copiato. Ricorda che da questo momento il testo è fuori dall\'app.'; }, 'pri'), cp)));
  el.append(h('section', { class: 'card' }, h('h2', null, 'Sicurezza e archivio'),
    h('ul', null, h('li', null, 'Nessuna connessione di rete: la policy del browser (CSP) vieta qualsiasi invio. L\'unico modo di far uscire dati è un tuo copia-incolla.'), h('li', null, 'File cifrato con AES-256-GCM; chiave derivata dalla passphrase con PBKDF2-SHA256 (' + nf0.format(ITER) + ' iterazioni).'), h('li', null, DEMO ? 'Modalità demo: nulla è salvato.' : FH ? 'File: ' + FH.name + ' (salvataggio automatico a ogni modifica).' : 'Il browser non salva direttamente su file: usa "Scarica copia".')),
    DEMO ? null : h('div', { class: 'row' },
      btn('Scarica copia cifrata (backup)', downloadCopy),
      btn('Cambia passphrase', () => form('Cambia passphrase', [{ key: 'o', label: 'Passphrase attuale', type: 'password', req: true }, { key: 'n1', label: 'Nuova passphrase', type: 'password', req: true, hint: 'Almeno 12 caratteri.' }, { key: 'n2', label: 'Ripeti la nuova passphrase', type: 'password', req: true }], {}, o => { if (o.n1.length < 12) return 'Servono almeno 12 caratteri.'; if (o.n1 !== o.n2) return 'Le due passphrase non coincidono.'; return changePass(o.o, o.n1); })),
      h('label', { class: 'fld', style: 'margin:0' }, h('span', null, 'Blocco automatico dopo'), h('select', { onchange: e => { S.settings.autolock = parseInt(e.target.value, 10); done(); } }, [[0, 'mai'], [2, '2 minuti'], [5, '5 minuti'], [10, '10 minuti'], [30, '30 minuti']].map(([v, l]) => h('option', { value: v, selected: S.settings.autolock === v }, l))))),
    h('p', { class: 'muted' }, 'Conserva il file .finanze fuori da OneDrive e fanne una copia su una chiavetta tua. La passphrase non è recuperabile da nessuno.')));
  return el;
}

/* ============ dati dimostrativi ============ */
function demoData() {
  const D = newData(), ago = n => { const d = new Date(); d.setDate(d.getDate() - n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  D.fx = { USD: 0.92 };
  const I = (name, code, ccy, price, cls, area) => ({ id: uid(), name, code, ccy, price, priceDate: today(), cls, area, hist: [{ d: today(), p: price }] });
  const wld = I('ETF Azionario Mondo (demo)', 'DEMO-WLD', 'EUR', 110, 'Azioni', 'USA 65, Europa 18, Asia 10, Emergenti 7');
  const bnd = I('ETF Obbligazionario Euro (demo)', 'DEMO-BND', 'EUR', 95, 'Obbligazioni', 'Europa');
  const us = I('Azione USA (demo)', 'DEMO-US', 'USD', 210, 'Azioni', 'USA');
  const btc = I('Bitcoin (demo)', 'BTC', 'EUR', 58000, 'Crypto', 'n.d.');
  const pf = I('Fondo pensione – comparto (demo)', 'DEMO-FP', 'EUR', 21.5, 'Azioni 60, Obbligazioni 40', 'Mondo');
  D.instruments = [wld, bnd, us, btc, pf];
  const P = (i, qty, cost) => ({ id: uid(), instId: i.id, qty, cost });
  const F = (date, type, amount, note) => ({ id: uid(), date, type, amount, note: note || '' });
  const A = (name, type, perf, cash, positions, flows, note) => ({ id: uid(), name, type, perf, cash, cashCcy: 'EUR', note: note || '', positions, flows });
  D.accounts = [
    A('Broker A (demo)', 'broker', true, 1200, [P(wld, 120, 11500), P(bnd, 60, 6000), P(us, 20, 3600)], [F(ago(700), 'partenza', 15000, 'Valore di partenza'), F(ago(400), 'versamento', 5000), F(ago(150), 'versamento', 3000)]),
    A('Exchange crypto (demo)', 'crypto', true, 0, [P(btc, 0.15, 5200)], [F(ago(500), 'partenza', 5200)]),
    A('Fondo pensione (demo)', 'pensione', true, 0, [P(pf, 1100, 21500)], [F(ago(800), 'partenza', 17000), F(ago(500), 'versamento', 1500), F(ago(300), 'versamento', 1500), F(ago(100), 'versamento', 1500)], 'Fondo a quote'),
    A('Conto corrente (demo)', 'banca', false, 8000, [], []),
    A('Trading MT4 (demo)', 'trading', true, 2300, [], [F(ago(300), 'partenza', 3000)])
  ];
  const keep = S; S = D;
  const curPerf = D.accounts.filter(a => a.perf).reduce((t, a) => t + accValue(a), 0), curTot = totalValue();
  for (let k = 6; k >= 0; k--) { const f = (0.9 + 0.1 * (6 - k) / 6) * (1 + 0.012 * Math.sin(k * 2)); D.snapshots.push({ date: ago(k * 30), total: curTot - curPerf + curPerf * f, perf: curPerf * f, accs: {} }); }
  S = keep; D.policy = { horizon: '20', maxLoss: '25', target: 'Azioni 65, Obbligazioni 20, Crypto 5, Liquidità 10', notes: '' };
  return D;
}
