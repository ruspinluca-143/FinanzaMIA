<div id="app"><p class="boot">Caricamento… Se vedi solo questa scritta, lo script è stato bloccato dal browser: esegui sigilla.ps1.</p></div>
<script>
'use strict';
const $app = document.getElementById('app');
const enc = new TextEncoder(), dec = new TextDecoder();

/* ============ DOM ============ */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = !!v;
    else if (k === 'selected') el.selected = !!v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
function s(tag, attrs, ...kids) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) if (v != null) el.setAttribute(k, v);
  for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
const btn = (label, fn, cls) => h('button', { type: 'button', class: 'btn ' + (cls || ''), onclick: fn }, label);

/* ============ formati ============ */
const nf0 = new Intl.NumberFormat('it-IT', { maximumFractionDigits: 0, useGrouping: 'always' });
const nf2 = new Intl.NumberFormat('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: 'always' });
const nfq = new Intl.NumberFormat('it-IT', { maximumFractionDigits: 6, useGrouping: 'always' });
const nfp = new Intl.NumberFormat('it-IT', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
let HIDE = false;
const fin = n => n != null && isFinite(n);
const eur = (n, d2) => HIDE ? '••••' : !fin(n) ? '—' : (d2 ? nf2 : nf0).format(n) + ' €';
const seur = n => HIDE ? '••••' : !fin(n) ? '—' : (n > 0 ? '+' : '') + nf0.format(n) + ' €';
const pct = n => !fin(n) ? '—' : nfp.format(n * 100) + '%';
const spct = n => !fin(n) ? '—' : (n > 0 ? '+' : '') + pct(n);
const fmtDate = d => { const x = new Date(d + 'T00:00:00'); return isNaN(x) ? '—' : x.toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: 'numeric' }); };
const compact = n => Math.abs(n) >= 1e6 ? (n / 1e6).toLocaleString('it-IT', { maximumFractionDigits: 1 }) + ' M' : Math.abs(n) >= 1e3 ? (n / 1e3).toLocaleString('it-IT', { maximumFractionDigits: 1 }) + ' k' : String(Math.round(n));
function gl(n, text) {
  const c = !fin(n) ? '' : n > 1e-9 ? 'gain' : n < -1e-9 ? 'loss' : '';
  return h('span', { class: 'gl ' + c }, c === 'gain' ? '▲ ' : c === 'loss' ? '▼ ' : '', text);
}
const uid = () => Array.from(crypto.getRandomValues(new Uint8Array(8)), b => b.toString(16).padStart(2, '0')).join('');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const dayMs = d => new Date(d + 'T00:00:00').getTime();
const daysSince = d => Math.round((dayMs(today()) - dayMs(d)) / 864e5);
const pl = (n, s, p) => n + ' ' + (n === 1 ? s : p);

/* ============ stato ============ */
let S = null;            // dati in memoria (decifrati)
let KEY = null, SALT = null, ITER = 1000000, VERIFY = null;
let FH = null;           // handle del file (se il browser lo permette)
let DIRTY = false, DEMO = false, LOCKED = false, STATUS = '';
let CANSAVE = false;     // dati caricati dall'esterno in sola visualizzazione: si possono salvare in un archivio cifrato
let saveTimer = null, saveChain = Promise.resolve(), lastActivity = Date.now();
let UNSAVED = false;     // l'ultimo tentativo di salvataggio non e' riuscito da nessuna parte (ne' sul dispositivo ne' su file)
const UI = { tab: 'panoramica', acc: null, dim: 'class', scen: 'ribasso', shock: null, chartTable: false, sum: { amounts: false, accNames: false, instNames: true, q: '' } };

const TYPES = {
  broker: { label: 'Broker / investimenti', perf: true },
  crypto: { label: 'Crypto / exchange', perf: true },
  pensione: { label: 'Fondo pensione', perf: true },
  trading: { label: 'Trading (MT4…)', perf: true },
  deposito: { label: 'Conto deposito / vincolato', perf: true },
  contanti: { label: 'Contanti', perf: false },
  banca: { label: 'Conto corrente / banca', perf: false },
  pagamenti: { label: 'Pagamenti / carte', perf: false },
  altro: { label: 'Altro', perf: false }
};
const FLOW_TYPES = [['versamento', 'Versamento (soldi che entrano)'], ['prelievo', 'Prelievo (soldi che escono)'], ['partenza', 'Valore di partenza (inizio tracciamento)']];
const flowSign = t => t === 'prelievo' ? -1 : 1;
const newData = () => ({ v: 1, created: today(), settings: { autolock: 5 }, fx: {}, accounts: [], instruments: [], snapshots: [], policy: { horizon: '', maxLoss: '', target: '', notes: '' }, journal: [], goal: { cagr: 20, years: 5, monthly: 0, assume: {} }, ops: [], plans: [], budget: newBudget() });
function migrate(d) {
  d.settings = Object.assign({ autolock: 5 }, d.settings); d.fx = d.fx || {}; d.snapshots = d.snapshots || []; d.instruments = d.instruments || [];
  d.policy = Object.assign({ horizon: '', maxLoss: '', target: '', notes: '' }, d.policy);
  d.journal = d.journal || []; d.goal = Object.assign({ cagr: 20, years: 5, monthly: 0, assume: {} }, d.goal);
  d.ops = d.ops || []; d.plans = d.plans || []; d.budget = Object.assign(newBudget(), d.budget); d.budget.items = d.budget.items || []; d.budget.hist = d.budget.hist || [];
  for (const a of (d.accounts = d.accounts || [])) { a.positions = a.positions || []; a.flows = a.flows || []; a.imports = a.imports || []; a.cash = a.cash || 0; a.cashCcy = a.cashCcy || 'EUR'; }
  for (const i of d.instruments) i.hist = i.hist || [];
}

/* ============ cifratura (AES-256-GCM, chiave da passphrase con PBKDF2) ============ */
const b64 = u8 => { let t = ''; for (let i = 0; i < u8.length; i += 0x8000) t += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(t); };
const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
const CAN_CRYPTO = () => !!(window.crypto && window.crypto.subtle);          // la cifratura del browser esiste solo in pagine "sicure": file aperto da Edge/Chrome/Safari o indirizzo https
const NOCRYPTO = 'Questa pagina è aperta in un modo in cui il browser non permette la cifratura (succede nelle anteprime incorporate in altre app e con indirizzi http:// non locali). Aprila in Edge, Chrome o Safari: sul computer con doppio clic su finanze.html, oppure da https://ruspinluca-143.github.io/FinanzaMIA/. La demo funziona anche qui.';
async function deriveKey(pass, salt, iter) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
const hdr = () => ({ app: 'finanze', v: 1, kdf: 'PBKDF2-SHA256', iter: ITER, salt: b64(SALT) });
/* ---- copia cifrata sul dispositivo (IndexedDB): al prossimo avvio basta la passphrase, senza ricaricare il file ---- */
const LOC = { rec: null, ok: false, off: false, persisted: null, err: '', where: '' };          // rec = { text, saved, at }: lo stesso testo cifrato che finisce nel file .finanze
const idbOpen = () => new Promise((res, rej) => {
  if (!window.indexedDB) return rej(new Error('questo browser non permette di salvare sul dispositivo'));
  const r = indexedDB.open('finanze-locale', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('k');
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error || new Error('apertura non riuscita')); r.onblocked = () => rej(new Error('archivio locale bloccato da un\'altra scheda'));
});
async function idbDo(mode, fn) {
  const db = await idbOpen();
  try { return await new Promise((res, rej) => { const tx = db.transaction('k', mode), rq = fn(tx.objectStore('k')); tx.oncomplete = () => res(rq ? rq.result : undefined); tx.onerror = tx.onabort = () => rej(tx.error || new Error('operazione annullata')); }); }
  finally { db.close(); }
}
const LS_KEY = 'finanze-archivio';          // riserva: se IndexedDB non funziona (alcuni browser o criteri aziendali) si prova con la memoria locale semplice
async function locGet() {
  try { const r = await idbDo('readonly', st => st.get('archivio')); if (r && r.text) { LOC.where = 'IndexedDB'; return r; } } catch (e) { LOC.err = String(e.message || e); }
  try { const t = localStorage.getItem(LS_KEY); if (t) { const r = JSON.parse(t); if (r && r.text) { LOC.where = 'memoria locale'; return r; } } } catch (e) { LOC.err = LOC.err || String(e.message || e); }
  return null;
}
async function locPut(text, at) {
  const rec = { text, saved: new Date().toISOString(), at: at || '' };
  try { await idbDo('readwrite', st => st.put(rec, 'archivio')); LOC.where = 'IndexedDB'; try { localStorage.removeItem(LS_KEY); } catch { /* niente */ } }
  catch (e1) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(rec)); LOC.where = 'memoria locale'; }
    catch (e2) { throw new Error(String(e1.message || e1) + (e2 && e2.name ? ' / ' + e2.name : '')); }
  }
  LOC.rec = rec; LOC.ok = true; LOC.err = '';
  if (LOC.persisted == null && navigator.storage && navigator.storage.persist) { try { LOC.persisted = await navigator.storage.persist(); } catch { LOC.persisted = false; } }          // chiede al browser di non cancellare questi dati da solo
}
async function locDel() { let bad = null; try { await idbDo('readwrite', st => st.delete('archivio')); } catch (e) { bad = e; } try { localStorage.removeItem(LS_KEY); } catch { /* niente */ } if (bad && LOC.where !== 'memoria locale') throw bad; LOC.rec = null; LOC.ok = false; }
async function seal() {
  S.savedAt = new Date().toISOString();          // dentro la parte cifrata: serve a capire quale delle due copie (dispositivo o file) e' la piu' recente
  const iv = crypto.getRandomValues(new Uint8Array(12)), header = hdr();
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: enc.encode(JSON.stringify(header)) }, KEY, enc.encode(JSON.stringify(S)));
  return JSON.stringify({ ...header, iv: b64(iv), ct: b64(new Uint8Array(ct)) });
}
async function makeVerify() {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  return { iv, ct: new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, KEY, enc.encode('ok'))) };
}
async function checkPass(pass) {
  try { const k = await deriveKey(pass, SALT, ITER); return dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: VERIFY.iv }, k, VERIFY.ct)) === 'ok'; } catch { return false; }
}
async function openArchive(text, fh, pass, fromLocal) {          // fromLocal: la copia salvata sul dispositivo (si apre con la sola passphrase)
  let f; try { f = JSON.parse(text); } catch { return 'Il file non è un archivio valido.'; }
  if (!f || f.app !== 'finanze' || f.v !== 1 || f.kdf !== 'PBKDF2-SHA256' || !(f.iter >= 100000 && f.iter <= 20000000) || !f.salt || !f.iv || !f.ct) return 'Il file non è un archivio Finanze valido.';
  if (fh && fh.requestPermission) { try { if (await fh.requestPermission({ mode: 'readwrite' }) !== 'granted') fh = null; } catch { fh = null; } }
  const salt = unb64(f.salt), key = await deriveKey(pass, salt, f.iter);
  const header = { app: f.app, v: f.v, kdf: f.kdf, iter: f.iter, salt: f.salt };
  let pt;
  try { pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(f.iv), additionalData: enc.encode(JSON.stringify(header)) }, key, unb64(f.ct)); }
  catch { return 'Passphrase errata oppure file danneggiato.'; }
  const D = JSON.parse(dec.decode(pt)); migrate(D);
  if (!fromLocal && LOC.rec && LOC.rec.at && LOC.rec.at > (D.savedAt || '') && !confirm('Su questo dispositivo c\'è una versione più recente di questo file (modificata il ' + new Date(LOC.rec.at).toLocaleString('it-IT', { dateStyle: 'short', timeStyle: 'short' }) + '). Se apri il file la sostituisci e perdi le modifiche fatte dopo. Aprire comunque il file?')) return 'Apertura annullata: la versione su questo dispositivo è più recente.';
  S = D; SALT = salt; ITER = f.iter; KEY = key; VERIFY = await makeVerify(); FH = fh; DEMO = false; DIRTY = false; UNSAVED = false; LOC.off = false;
  if (!fromLocal) { if (!S.settings.backupAt) S.settings.backupAt = today(); try { await locPut(text, S.savedAt); } catch (e) { LOC.ok = false; LOC.err = String(e.message || e); } }          // un file appena aperto vale come copia di sicurezza; si tiene anche sul dispositivo
  enter(); setStatus(fromLocal ? 'Aperto dal dispositivo' : fh ? 'Aperto · ' + fh.name : LOC.ok ? 'Aperto e salvato su questo dispositivo' : 'Aperto (questo browser non salva da solo: usa "Scarica copia")');
}
async function createArchive(pass, keepData) {      // keepData: tiene i dati già in memoria invece di partire da un archivio vuoto
  let fh = null;
  if (window.showSaveFilePicker) {
    try { fh = await showSaveFilePicker({ suggestedName: 'finanze.finanze', types: [{ description: 'Archivio Finanze cifrato', accept: { 'application/octet-stream': ['.finanze'] } }] }); }
    catch (e) { if (e && e.name === 'AbortError') return 'Creazione annullata.'; fh = null; }
  }
  if (!keepData) S = newData();
  SALT = crypto.getRandomValues(new Uint8Array(16)); ITER = 1000000;
  KEY = await deriveKey(pass, SALT, ITER); VERIFY = await makeVerify(); FH = fh; DEMO = false; CANSAVE = false; DIRTY = true;
  enter(); await save(true);
}
async function changePass(oldp, newp) {
  if (!(await checkPass(oldp))) return 'La passphrase attuale non è corretta.';
  SALT = crypto.getRandomValues(new Uint8Array(16)); KEY = await deriveKey(newp, SALT, ITER); VERIFY = await makeVerify();
  touch(); await save(true);
}

/* ============ salvataggio ============ */
function setStatus(t) { STATUS = t; const e = document.getElementById('status'); if (e) e.textContent = t; refreshUnsaved(); }
const backupDays = () => S && S.settings ? daysSince(S.settings.backupAt || S.created || today()) : 0;          // giorni dall'ultima copia su file
const backupDue = () => backupDays() >= 30;
const needsSave = () => !!(KEY && !DEMO && (UNSAVED || (!FH && backupDue())));          // avviso: o non si riesce a salvare, o la copia di sicurezza su file e' vecchia
const unsavedText = () => UNSAVED ? 'Hai modifiche non salvate: questo browser non riesce a tenerle da solo, salvale in un file.' : 'Da ' + backupDays() + ' giorni non fai una copia di sicurezza su file: se il browser cancellasse i dati del sito, senza una copia perderesti tutto.';
function refreshUnsaved() { const e = document.getElementById('unsaved'); if (!e) return; e.hidden = !needsSave(); const m = document.getElementById('unsavedMsg'); if (m) m.textContent = unsavedText(); }
const unsavedBar = () => h('div', { class: 'banner unsaved', id: 'unsaved', hidden: needsSave() ? null : '', role: 'status' }, h('span', { id: 'unsavedMsg' }, unsavedText()),
  btn(typeof navigator.canShare === 'function' ? 'Salva in File' : 'Scarica copia', () => { if (typeof navigator.canShare === 'function') shareCopy(); else downloadCopy(); }, 'pri sm'));
function touch() {
  DIRTY = true;
  if (DEMO) { setStatus('Demo: nulla viene salvato'); return; }
  setStatus('Salvataggio…'); clearTimeout(saveTimer); saveTimer = setTimeout(() => save(false), 600);          // a ogni modifica: copia sul dispositivo e, se c'e', anche sul file
}
function save(manual) { saveChain = saveChain.then(() => doSave(manual)).catch(() => {}); return saveChain; }
async function doSave(manual) {
  if (DEMO || !KEY || !S) return;
  const prevBackup = S.settings.backupAt, toFile = !!(FH || manual);
  try {
    if (toFile) S.settings.backupAt = today();          // si scrive prima di cifrare, cosi' la data e' dentro la copia
    const text = await seal(), hm = new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    let loc = false, file = false, why = '';
    if (!LOC.off) { try { await locPut(text, S.savedAt); loc = true; } catch (e) { LOC.ok = false; LOC.err = String(e.message || e); why = LOC.err; } }
    if (FH) {
      try {
        if (manual && FH.queryPermission) { try { if (await FH.queryPermission({ mode: 'readwrite' }) !== 'granted') await FH.requestPermission({ mode: 'readwrite' }); } catch { /* si prova comunque */ } }
        const w = await FH.createWritable(); await w.write(text); await w.close(); file = true;
      } catch (e) { why = String(e.message || e); }
    } else if (manual) { download(text); file = true; }
    if (toFile && !file) S.settings.backupAt = prevBackup;
    UNSAVED = !(loc || file); DIRTY = UNSAVED;
    const noDev = !loc && !LOC.off ? ' · NON salvato sul dispositivo (' + (why || 'motivo sconosciuto') + ')' : '';          // il motivo si legge subito qui, senza cercarlo altrove
    if (file && FH) setStatus('Salvato · ' + FH.name + (loc ? ' e su questo dispositivo' : '') + ' · ' + hm + noDev);
    else if (file) setStatus('Copia scaricata nella cartella Download alle ' + hm + (loc ? ' · salvato anche su questo dispositivo' : '') + noDev);
    else if (loc) setStatus('Salvato su questo dispositivo · ' + hm);
    else setStatus('Non riesco a salvare' + (why ? ' (' + why + ')' : '') + ': usa "Scarica copia"');
  } catch (e) { S.settings.backupAt = prevBackup; UNSAVED = true; setStatus('Errore di salvataggio (' + (e.message || e) + '): usa "Scarica copia"'); }
}
const copyName = () => 'finanze-' + today() + '.finanze';          // con la data nel nome: una copia nuova non si confonde con quelle vecchie
function download(text) {
  const url = URL.createObjectURL(new Blob([text], { type: 'application/octet-stream' }));
  const a = h('a', { href: url, download: copyName() }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}
async function exportCopy(send) {          // send(text) -> true se la copia e' davvero uscita (scaricata o condivisa); in quel caso la data della copia di sicurezza si aggiorna
  if (!KEY || DEMO) return false;
  const prev = S.settings.backupAt; S.settings.backupAt = today();
  const text = await seal();
  if (!(await send(text))) { S.settings.backupAt = prev; return false; }
  if (!LOC.off) { try { await locPut(text, S.savedAt); } catch (e) { LOC.ok = false; LOC.err = String(e.message || e); } }
  UNSAVED = false; DIRTY = false; return true;
}
async function downloadCopy() { if (await exportCopy(async t => { download(t); return true; })) setStatus('Copia cifrata scaricata nella cartella Download: ' + copyName()); }
async function shareCopy() {     // iPhone e Mac (Safari): foglio di condivisione di sistema -> "Salva su File" (iCloud Drive o "Su questo iPhone")
  if (!KEY) return;
  let msg = '';
  const ok = await exportCopy(async text => {
    for (const type of ['application/octet-stream', 'application/json', 'text/plain']) {
      const f = new File([text], copyName(), { type });
      if (!(navigator.canShare && navigator.canShare({ files: [f] }))) continue;
      try { await navigator.share({ files: [f], title: 'Archivio Finanze' }); return true; }
      catch (e) { if (!e || e.name !== 'AbortError') msg = 'Condivisione non riuscita: usa "Scarica copia"'; return false; }
    }
    download(text); return true;
  });
  setStatus(ok ? 'Copia di sicurezza salvata o condivisa' : msg || 'Copia annullata');
}
window.addEventListener('beforeunload', e => { if (DIRTY && !DEMO) { e.preventDefault(); e.returnValue = ''; } });

/* ============ blocco automatico ============ */
async function lock() {
  if (DEMO || !KEY || LOCKED) return;
  if (DIRTY) { clearTimeout(saveTimer); await save(false); }
  document.querySelectorAll('dialog').forEach(d => { if (d.open) d.close(); d.remove(); });
  LOCKED = true; render();
}
for (const ev of ['pointerdown', 'keydown', 'pointermove']) window.addEventListener(ev, () => { lastActivity = Date.now(); }, { passive: true });
setInterval(() => { const m = S && S.settings.autolock; if (m > 0 && KEY && !LOCKED && !DEMO && Date.now() - lastActivity > m * 60000) lock(); }, 15000);

let hiddenAt = 0;       // su iPhone i timer si fermano quando l'app va in secondo piano: al ritorno si controlla da quanto tempo eri via
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  const m = S && S.settings.autolock;
  if (hiddenAt && m > 0 && KEY && !LOCKED && !DEMO && Date.now() - hiddenAt > m * 60000) lock();
  hiddenAt = 0;
});

/* ============ calcoli ============ */
const fxRate = c => (!c || c === 'EUR') ? 1 : (S.fx[c] > 0 ? S.fx[c] : null);
const inst = id => S.instruments.find(i => i.id === id);
const posValue = p => { const i = inst(p.instId); return i ? p.qty * i.price * (fxRate(i.ccy) ?? 1) : 0; };
const accCash = a => a.dep ? depValue(a.dep) : (a.cash || 0) * (fxRate(a.cashCcy) ?? 1);      // conto deposito: capitale piu' interessi maturati
const accValue = a => accCash(a) + a.positions.reduce((t, p) => t + posValue(p), 0);
const totalValue = () => S.accounts.reduce((t, a) => t + accValue(a), 0);
const netContrib = (a, upto) => a.flows.filter(f => !upto || f.date <= upto).reduce((t, f) => t + flowSign(f.type) * f.amount, 0);

function xirr(flows) {            // flussi: {t: ms, a: importo}, versamenti negativi, valore finale positivo

  if (best) return best;

/* ---- conti deposito e vincolati: interessi semplici maturati, al netto della ritenuta ---- */
function depValue(dp, onDate) {
  if (!dp || !(dp.principal > 0)) return 0;
  const d1 = dayMs(onDate || today()), d0 = dayMs(dp.start || today()), dEnd = dp.end ? dayMs(dp.end) : Infinity;
  const days = Math.max(0, (Math.min(d1, dEnd) - d0) / 864e5);
  const gross = dp.principal * (dp.rate || 0) / 100 * days / 365;
  return dp.principal + gross * (1 - (dp.taxPct ?? 26) / 100);
}

/* ---- storico dei prezzi: lettura, serie del valore, variazioni ---- */
function parseHistory(text) {
  const byKey = new Map();
  const L = String(text || '').split(/\r?\n/);
  for (let k = 1; k < L.length; k++) {
    const f = L[k].split(';'); if (f.length < 7) continue;
    const p = parseFloat(f[3]); if (!(p > 0) || !/^\d{4}-\d{2}-\d{2}$/.test(f[5])) continue;
    for (const key of [f[1].toLowerCase(), f[2].toLowerCase()]) { if (!key) continue; if (!byKey.has(key)) byKey.set(key, new Map()); byKey.get(key).set(f[5], p); }      // per ogni giorno vale l'ultimo prezzo letto
  }
  const out = new Map();
  for (const [k, m] of byKey) out.set(k, [...m.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1).map(([d, p]) => ({ d, p })));
  return out;
}
function seriesOf(i) {
  const own = (i.hist || []).map(x => [x.d, x.p]);
  const h2 = DATA.hist && (DATA.hist.get(i.name.toLowerCase()) || (i.code && DATA.hist.get(i.code.toLowerCase())));
  const m = new Map(own); if (h2) for (const x of h2) m.set(x.d, x.p);
  return [...m.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1).map(([d, p]) => ({ d, p }));
}
function priceAtS(s, fallback, d) {
  if (!s.length) return fallback;
  if (d <= s[0].d) return s[0].p;
  let lo = 0, hi = s.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (s[m].d <= d) lo = m; else hi = m - 1; }
  return s[lo].p;
}
function valueSeries(accs) {              // valore dei conti nel tempo con le quantita' di oggi (non conosce acquisti e vendite passati)
  const held = new Map();
  for (const a of accs) for (const p of a.positions) { const i = inst(p.instId); if (i) held.set(i.id, (held.get(i.id) || 0) + p.qty); }
  const ser = new Map(), dates = new Set([today()]);
  for (const id of held.keys()) { const s = seriesOf(inst(id)); ser.set(id, s); for (const x of s) if (x.d <= today()) dates.add(x.d); }
  const cashFixed = accs.reduce((t, a) => t + (a.dep ? 0 : accCash(a)), 0);
  return [...dates].sort().map(d => {
    let v = cashFixed + accs.reduce((t, a) => t + (a.dep ? depValue(a.dep, d) : 0), 0);
    for (const [id, q] of held) { const i = inst(id); v += q * (d === today() ? i.price : priceAtS(ser.get(id), i.price, d)) * (fxRate(i.ccy) ?? 1); }
    return { d, t: dayMs(d), v };
  });
}
const isoOf = t => { const x = new Date(t); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };

  const last = pts[pts.length - 1], lim = isoOf(last.t - days * 864e5); let ref = null;

  return ref ? { abs: last.v - ref.v, pct: ref.v > 0 ? last.v / ref.v - 1 : null, d: ref.d } : null;
}

  D.fx = { USD: 0.92 };

  D.accounts = [

    A('Exchange crypto (demo)', 'crypto', true, 0, [P(btc, 0.15, 5200)], [F(ago(500), 'partenza', 5200)]),
    A('Fondo pensione (demo)', 'pensione', true, 0, [P(pf, 1100, 21500)], [F(ago(800), 'partenza', 17000), F(ago(500), 'versamento', 1500), F(ago(300), 'versamento', 1500), F(ago(100), 'versamento', 1500)], 'Fondo a quote'),
    A('Conto corrente (demo)', 'banca', false, 8000, [], []),
    A('Trading MT4 (demo)', 'trading', true, 2300, [], [F(ago(300), 'partenza', 3000)])
  ];
  D.plans = [{ id: uid(), label: 'PAC ETF mondo (demo)', kind: 'acquisto', accId: D.accounts[0].id, instId: wld.id, amount: 300, freq: 'mensile', day: 5, start: ago(200), end: '', note: '', since: today(), done: [] }, { id: uid(), label: 'Versamento fondo pensione (demo)', kind: 'versamento', accId: D.accounts[2].id, instId: '', amount: 150, freq: 'mensile', day: 20, start: ago(200), end: '', note: '', since: today(), done: [] }];
  const mk = (kind, label, amount, freq, start, avg) => ({ id: uid(), kind, label, amount, freq, start, end: '', avg: !!avg }), mon = n => { const d = new Date(); d.setMonth(d.getMonth() - n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
  D.budget = Object.assign(newBudget(), { items: [mk('entrata', 'Stipendio (demo)', 2100, 'mensile', ago(300)), mk('entrata', 'Dogsitter (demo)', 250, 'mensile', ago(300), true), mk('spesa', 'Affitto (demo)', 750, 'mensile', ago(300)), mk('spesa', 'Bollette e spesa (demo)', 520, 'mensile', ago(300)), mk('spesa', 'Spese generali (demo)', 400, 'mensile', ago(300)), mk('spesa', 'Assicurazione auto (demo)', 600, 'annuale', ago(120)), mk('spesa', 'Anticipo casa (demo)', 40000, 'una-tantum', addMonthsStr(today(), 36))], hist: [1, 2, 3, 4, 5, 6].map((n, k) => ({ id: uid(), label: 'Dogsitter (demo)', month: mon(n), amount: [310, 180, 260, 420, 90, 240][k] })) });
  const keep = S; S = D;
  const curPerf = D.accounts.filter(a => a.perf).reduce((t, a) => t + accValue(a), 0), curTot = totalValue();
