<script>
'use strict';
const $app = document.getElementById('app');
const enc = new TextEncoder(), dec = new TextDecoder();

/* ============ DOM ============ */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = !!v;
    else if (k === 'selected') el.selected = !!v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
function s(tag, attrs, ...kids) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) if (v != null) el.setAttribute(k, v);
  for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
const btn = (label, fn, cls) => h('button', { type: 'button', class: 'btn ' + (cls || ''), onclick: fn }, label);

/* ============ formati ============ */
const nf0 = new Intl.NumberFormat('it-IT', { maximumFractionDigits: 0, useGrouping: 'always' });
const nf2 = new Intl.NumberFormat('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: 'always' });
const nfq = new Intl.NumberFormat('it-IT', { maximumFractionDigits: 6, useGrouping: 'always' });
const nfp = new Intl.NumberFormat('it-IT', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
let HIDE = false;
const fin = n => n != null && isFinite(n);
const eur = (n, d2) => HIDE ? '••••' : !fin(n) ? '—' : (d2 ? nf2 : nf0).format(n) + ' €';
const seur = n => HIDE ? '••••' : !fin(n) ? '—' : (n > 0 ? '+' : '') + nf0.format(n) + ' €';
const pct = n => !fin(n) ? '—' : nfp.format(n * 100) + '%';
const spct = n => !fin(n) ? '—' : (n > 0 ? '+' : '') + pct(n);
const fmtDate = d => { const x = new Date(d + 'T00:00:00'); return isNaN(x) ? '—' : x.toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: 'numeric' }); };
const compact = n => Math.abs(n) >= 1e6 ? (n / 1e6).toLocaleString('it-IT', { maximumFractionDigits: 1 }) + ' M' : Math.abs(n) >= 1e3 ? (n / 1e3).toLocaleString('it-IT', { maximumFractionDigits: 1 }) + ' k' : String(Math.round(n));
function gl(n, text) {
  const c = !fin(n) ? '' : n > 1e-9 ? 'gain' : n < -1e-9 ? 'loss' : '';
  return h('span', { class: 'gl ' + c }, c === 'gain' ? '▲ ' : c === 'loss' ? '▼ ' : '', text);
}
const uid = () => Array.from(crypto.getRandomValues(new Uint8Array(8)), b => b.toString(16).padStart(2, '0')).join('');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const dayMs = d => new Date(d + 'T00:00:00').getTime();
const daysSince = d => Math.round((dayMs(today()) - dayMs(d)) / 864e5);
const pl = (n, s, p) => n + ' ' + (n === 1 ? s : p);

/* ============ stato ============ */
let S = null;            // dati in memoria (decifrati)
let KEY = null, SALT = null, ITER = 1000000, VERIFY = null;
let FH = null;           // handle del file (se il browser lo permette)
let DIRTY = false, DEMO = false, LOCKED = false, STATUS = '';
let CANSAVE = false;     // dati caricati dall'esterno in sola visualizzazione: si possono salvare in un archivio cifrato
let saveTimer = null, saveChain = Promise.resolve(), lastActivity = Date.now();
const UI = { tab: 'panoramica', acc: null, dim: 'class', scen: 'ribasso', shock: null, chartTable: false, sum: { amounts: false, accNames: false, instNames: true, q: '' } };

const TYPES = {
  broker: { label: 'Broker / investimenti', perf: true },
  crypto: { label: 'Crypto / exchange', perf: true },
  pensione: { label: 'Fondo pensione', perf: true },
  trading: { label: 'Trading (MT4…)', perf: true },
  deposito: { label: 'Conto deposito / vincolato', perf: true },
  contanti: { label: 'Contanti', perf: false },
  banca: { label: 'Conto corrente / banca', perf: false },
  pagamenti: { label: 'Pagamenti / carte', perf: false },
  altro: { label: 'Altro', perf: false }
};
const FLOW_TYPES = [['versamento', 'Versamento (soldi che entrano)'], ['prelievo', 'Prelievo (soldi che escono)'], ['partenza', 'Valore di partenza (inizio tracciamento)']];
const flowSign = t => t === 'prelievo' ? -1 : 1;
const newData = () => ({ v: 1, created: today(), settings: { autolock: 5 }, fx: {}, accounts: [], instruments: [], snapshots: [], policy: { horizon: '', maxLoss: '', target: '', notes: '' }, journal: [], goal: { cagr: 20, years: 5, monthly: 0, assume: {} } });
function migrate(d) {
  d.settings = Object.assign({ autolock: 5 }, d.settings); d.fx = d.fx || {}; d.snapshots = d.snapshots || []; d.instruments = d.instruments || [];
  d.policy = Object.assign({ horizon: '', maxLoss: '', target: '', notes: '' }, d.policy);
  d.journal = d.journal || []; d.goal = Object.assign({ cagr: 20, years: 5, monthly: 0, assume: {} }, d.goal);
  for (const a of (d.accounts = d.accounts || [])) { a.positions = a.positions || []; a.flows = a.flows || []; a.imports = a.imports || []; a.cash = a.cash || 0; a.cashCcy = a.cashCcy || 'EUR'; }
  for (const i of d.instruments) i.hist = i.hist || [];
}

/* ============ cifratura (AES-256-GCM, chiave da passphrase con PBKDF2) ============ */
const b64 = u8 => { let t = ''; for (let i = 0; i < u8.length; i += 0x8000) t += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(t); };
const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function deriveKey(pass, salt, iter) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
const hdr = () => ({ app: 'finanze', v: 1, kdf: 'PBKDF2-SHA256', iter: ITER, salt: b64(SALT) });
async function seal() {
  const iv = crypto.getRandomValues(new Uint8Array(12)), header = hdr();
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: enc.encode(JSON.stringify(header)) }, KEY, enc.encode(JSON.stringify(S)));
  return JSON.stringify({ ...header, iv: b64(iv), ct: b64(new Uint8Array(ct)) });
}
async function makeVerify() {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  return { iv, ct: new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, KEY, enc.encode('ok'))) };
}
async function checkPass(pass) {
  try { const k = await deriveKey(pass, SALT, ITER); return dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: VERIFY.iv }, k, VERIFY.ct)) === 'ok'; } catch { return false; }
}
async function openArchive(text, fh, pass) {
  let f; try { f = JSON.parse(text); } catch { return 'Il file non è un archivio valido.'; }
  if (!f || f.app !== 'finanze' || f.v !== 1 || f.kdf !== 'PBKDF2-SHA256' || !(f.iter >= 100000 && f.iter <= 20000000) || !f.salt || !f.iv || !f.ct) return 'Il file non è un archivio Finanze valido.';
  if (fh && fh.requestPermission) { try { if (await fh.requestPermission({ mode: 'readwrite' }) !== 'granted') fh = null; } catch { fh = null; } }
  const salt = unb64(f.salt), key = await deriveKey(pass, salt, f.iter);
  const header = { app: f.app, v: f.v, kdf: f.kdf, iter: f.iter, salt: f.salt };
  let pt;
  try { pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(f.iv), additionalData: enc.encode(JSON.stringify(header)) }, key, unb64(f.ct)); }
  catch { return 'Passphrase errata oppure file danneggiato.'; }
  S = JSON.parse(dec.decode(pt)); migrate(S);
  SALT = salt; ITER = f.iter; KEY = key; VERIFY = await makeVerify(); FH = fh; DEMO = false; DIRTY = false;
  enter(); setStatus(fh ? 'Aperto · ' + fh.name : 'Aperto (modalità copia: usa "Scarica copia" per salvare)');
}
async function createArchive(pass, keepData) {      // keepData: tiene i dati già in memoria invece di partire da un archivio vuoto
  let fh = null;
  if (window.showSaveFilePicker) {
    try { fh = await showSaveFilePicker({ suggestedName: 'finanze.finanze', types: [{ description: 'Archivio Finanze cifrato', accept: { 'application/octet-stream': ['.finanze'] } }] }); }
    catch (e) { if (e && e.name === 'AbortError') return 'Creazione annullata.'; fh = null; }
  }
  if (!keepData) S = newData();
  SALT = crypto.getRandomValues(new Uint8Array(16)); ITER = 1000000;
  KEY = await deriveKey(pass, SALT, ITER); VERIFY = await makeVerify(); FH = fh; DEMO = false; CANSAVE = false; DIRTY = true;
  enter(); await save(true);
}
async function changePass(oldp, newp) {
  if (!(await checkPass(oldp))) return 'La passphrase attuale non è corretta.';
  SALT = crypto.getRandomValues(new Uint8Array(16)); KEY = await deriveKey(newp, SALT, ITER); VERIFY = await makeVerify();
  touch(); await save(true);
}

/* ============ salvataggio ============ */
function setStatus(t) { STATUS = t; const e = document.getElementById('status'); if (e) e.textContent = t; refreshUnsaved(); }
const needsSave = () => !!(DIRTY && !FH && KEY && !DEMO);          // su Safari i dati restano in memoria finche' non li salvi in un file
function refreshUnsaved() { const e = document.getElementById('unsaved'); if (e) e.hidden = !needsSave(); }
const unsavedBar = () => h('div', { class: 'banner unsaved', id: 'unsaved', hidden: needsSave() ? null : '', role: 'status' }, h('span', null, 'Hai modifiche non salvate: su questo browser si salvano a mano in un file.'),
  btn(typeof navigator.canShare === 'function' ? 'Salva in File' : 'Scarica copia', () => { if (typeof navigator.canShare === 'function') shareCopy(); else save(true); }, 'pri sm'));
function touch() {
  DIRTY = true;
  if (DEMO) { setStatus('Demo: nulla viene salvato'); return; }
  if (!FH) { setStatus('Modifiche non salvate: premi "Scarica copia"'); return; }
  setStatus('Salvataggio…'); clearTimeout(saveTimer); saveTimer = setTimeout(() => save(false), 600);
}
function save(manual) { saveChain = saveChain.then(() => doSave(manual)).catch(() => {}); return saveChain; }
async function doSave(manual) {
  if (DEMO || !KEY || !S) return;
  try {
    const text = await seal(), hm = new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    if (FH) {
      if (manual && FH.queryPermission) { try { if (await FH.queryPermission({ mode: 'readwrite' }) !== 'granted') await FH.requestPermission({ mode: 'readwrite' }); } catch { /* si prova comunque */ } }
      const w = await FH.createWritable(); await w.write(text); await w.close();
      DIRTY = false; setStatus('Salvato · ' + FH.name + ' · ' + hm);
    } else { download(text); DIRTY = false; setStatus('Copia scaricata alle ' + hm); }
  } catch (e) { setStatus('Errore di salvataggio (' + (e.message || e) + '): usa "Scarica copia"'); }
}
function download(text) {
  const url = URL.createObjectURL(new Blob([text], { type: 'application/octet-stream' }));
  const a = h('a', { href: url, download: 'finanze.finanze' }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}
async function downloadCopy() { if (!KEY) return; download(await seal()); DIRTY = false; setStatus('Copia cifrata scaricata'); }
async function shareCopy() {     // iPhone e Mac (Safari): foglio di condivisione di sistema -> "Salva su File" (iCloud Drive o "Su questo iPhone")
  if (!KEY) return;
  const text = await seal();
  for (const type of ['application/octet-stream', 'application/json', 'text/plain']) {
    const f = new File([text], 'finanze.finanze', { type });
    if (!(navigator.canShare && navigator.canShare({ files: [f] }))) continue;
    try { await navigator.share({ files: [f], title: 'Archivio Finanze' }); DIRTY = false; setStatus('Archivio salvato o condiviso'); }
    catch (e) { if (!e || e.name !== 'AbortError') setStatus('Condivisione non riuscita: usa "Scarica copia"'); }
    return;
  }
  download(text); setStatus('Copia cifrata scaricata');
}
window.addEventListener('beforeunload', e => { if (DIRTY && !DEMO) { e.preventDefault(); e.returnValue = ''; } });

/* ============ blocco automatico ============ */
async function lock() {
  if (DEMO || !KEY || LOCKED) return;
  if (DIRTY && FH) await save(false);
  document.querySelectorAll('dialog').forEach(d => { if (d.open) d.close(); d.remove(); });
  LOCKED = true; render();
}
for (const ev of ['pointerdown', 'keydown', 'pointermove']) window.addEventListener(ev, () => { lastActivity = Date.now(); }, { passive: true });
setInterval(() => { const m = S && S.settings.autolock; if (m > 0 && KEY && !LOCKED && !DEMO && Date.now() - lastActivity > m * 60000) lock(); }, 15000);

let hiddenAt = 0;       // su iPhone i timer si fermano quando l'app va in secondo piano: al ritorno si controlla da quanto tempo eri via
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  const m = S && S.settings.autolock;
  if (hiddenAt && m > 0 && KEY && !LOCKED && !DEMO && Date.now() - hiddenAt > m * 60000) lock();
  hiddenAt = 0;
});

/* ============ calcoli ============ */
const fxRate = c => (!c || c === 'EUR') ? 1 : (S.fx[c] > 0 ? S.fx[c] : null);
const inst = id => S.instruments.find(i => i.id === id);
const posValue = p => { const i = inst(p.instId); return i ? p.qty * i.price * (fxRate(i.ccy) ?? 1) : 0; };
const accCash = a => a.dep ? depValue(a.dep) : (a.cash || 0) * (fxRate(a.cashCcy) ?? 1);      // conto deposito: capitale piu' interessi maturati
const accValue = a => accCash(a) + a.positions.reduce((t, p) => t + posValue(p), 0);
const totalValue = () => S.accounts.reduce((t, a) => t + accValue(a), 0);
const netContrib = (a, upto) => a.flows.filter(f => !upto || f.date <= upto).reduce((t, f) => t + flowSign(f.type) * f.amount, 0);

function xirr(flows) {            // flussi: {t: ms, a: importo}, versamenti negativi, valore finale positivo
  if (!flows.some(f => f.a > 0) || !flows.some(f => f.a < 0)) return null;
  const t0 = Math.min(...flows.map(f => f.t));
  const npv = r => flows.reduce((t, f) => t + f.a / Math.pow(1 + r, (f.t - t0) / 31557600000), 0);
  let lo = -0.99, hi = 10, flo = npv(lo), fhi = npv(hi);
  while (flo * fhi > 0 && hi < 1e6) { hi *= 4; fhi = npv(hi); }
  if (flo * fhi > 0) return null;
  for (let i = 0; i < 200; i++) { const mid = (lo + hi) / 2, fm = npv(mid); if (flo * fm <= 0) { hi = mid; fhi = fm; } else { lo = mid; flo = fm; } }
  return (lo + hi) / 2;
}
function perfOf(accs) {
  const value = accs.reduce((t, a) => t + accValue(a), 0), contrib = accs.reduce((t, a) => t + netContrib(a), 0);
  const flows = accs.flatMap(a => a.flows.map(f => ({ t: dayMs(f.date), a: -flowSign(f.type) * f.amount })));
  const has = flows.length > 0, pnl = has ? value - contrib : null, pnlPct = has && contrib > 0 ? pnl / contrib : null;
  let x = null, span = 0;
  if (has) { const t1 = dayMs(today()); span = (t1 - Math.min(...flows.map(f => f.t))) / 864e5; if (span >= 30) x = xirr(flows.concat([{ t: t1, a: value }])); }
  return { value, contrib, pnl, pnlPct, xirr: x, span, has };
}
function parseMix(txt, fallback) {
  const raw = String(txt || '').split(/[,;]/).map(t => t.trim()).filter(Boolean);
  if (!raw.length) return [[fallback, 1]];
  const items = raw.map(t => { const m = t.match(/^(.*?)[\s:=]+(\d+(?:\.\d+)?)\s*%?$/); return m && m[1].trim() ? [m[1].trim(), parseFloat(m[2])] : [t.replace(/\s*%$/, '').trim(), null]; });
  const withNum = items.filter(x => x[1] != null);
  if (!withNum.length) return items.map(x => [x[0], 1 / items.length]);
  const sum = withNum.reduce((t, x) => t + x[1], 0);
  if (sum <= 0) return [[fallback, 1]];
  return withNum.filter(x => x[1] > 0).map(x => [x[0], x[1] / sum]);
}
const mixStr = m => m.length === 1 ? m[0][0] : m.map(([k, w]) => k + ' ' + Math.round(w * 100) + '%').join(' · ');
function exposure(dim) {
  const m = new Map(), lab = new Map();
  const add = (label, v) => { if (!fin(v) || v === 0) return; const k = String(label).toLowerCase(); if (!lab.has(k)) lab.set(k, label); m.set(k, (m.get(k) || 0) + v); };
  for (const a of S.accounts) {
    const cash = accCash(a);
    if (cash) add(dim === 'ccy' ? (a.cashCcy || 'EUR') : dim === 'acc' ? a.name : 'Liquidità', cash);
    for (const p of a.positions) {
      const i = inst(p.instId); if (!i) continue; const v = posValue(p);
      if (dim === 'acc') add(a.name, v);
      else if (dim === 'inst') add(i.name, v);
      else if (dim === 'ccy') add(i.ccy || 'EUR', v);
      else for (const [k, w] of parseMix(dim === 'class' ? i.cls : i.area, 'Non classificato')) add(k, v * w);
    }
  }
  return [...m.entries()].map(([k, v]) => [lab.get(k), v]).sort((x, y) => y[1] - x[1]);
}
function positionsPnl() {
  const out = [];
  for (const a of S.accounts) for (const p of a.positions) {
    const i = inst(p.instId); if (!i || !(p.cost > 0)) continue;
    const v = posValue(p); out.push({ name: i.name, acc: a.name, v, pnl: v - p.cost, pct: (v - p.cost) / p.cost });
  }
  return out;
}
function missingFx() {
  const set = new Set();
  for (const a of S.accounts) { if (a.cash && a.cashCcy !== 'EUR' && !fxRate(a.cashCcy)) set.add(a.cashCcy); for (const p of a.positions) { const i = inst(p.instId); if (i && i.ccy !== 'EUR' && !fxRate(i.ccy)) set.add(i.ccy); } }
  return [...set];
}
function takeSnapshot() {
  const d = today(), pa = S.accounts.filter(a => a.perf);
  const rec = { date: d, total: totalValue(), perf: pa.reduce((t, a) => t + accValue(a), 0), accs: Object.fromEntries(S.accounts.map(a => [a.id, accValue(a)])) };
  const k = S.snapshots.findIndex(x => x.date === d); if (k >= 0) S.snapshots[k] = rec; else S.snapshots.push(rec);
  S.snapshots.sort((a, b) => a.date < b.date ? -1 : 1); touch();
}
function chartPoints() {
  const pa = S.accounts.filter(a => a.perf); if (!pa.length) return [];
  const contribAt = d => pa.reduce((t, a) => t + netContrib(a, d), 0);
  const pts = S.snapshots.map(n => ({ d: n.date, v: n.perf, c: contribAt(n.date) }));
  const t = today(); if (!pts.some(p => p.d === t)) pts.push({ d: t, v: pa.reduce((x, a) => x + accValue(a), 0), c: contribAt(t) });
  pts.sort((a, b) => a.d < b.d ? -1 : 1); pts.forEach(p => { p.t = dayMs(p.d); }); return pts;
}

/* ============ scenari (stress test) ============ */
const CLASS_KEYS = [['bond', /obblig|\bbond/i], ['equity', /\bazion|\bequity|\bstock/i], ['crypto', /cripto|crypto|bitcoin/i], ['re', /immob|\breit|real estate/i], ['comm', /\boro\b|materie|commod/i]];
const clsKey = l => (CLASS_KEYS.find(([, re]) => re.test(l)) || [null])[0];
const PRESETS = {
  ribasso: { label: 'Ribasso azionario −20%', cls: { equity: -.20, crypto: -.30, re: -.10, comm: -.05 }, fx: {} },
  crisi: { label: 'Crisi tipo 2008 (ipotetica)', cls: { equity: -.40, crypto: -.60, re: -.25, comm: -.25, bond: .02 }, fx: {} },
  crypto: { label: 'Crollo crypto −50%', cls: { crypto: -.50 }, fx: {} },
  dollaro: { label: 'Dollaro −10% sull\'euro', cls: {}, fx: { USD: -.10 } },
  tassi: { label: 'Rialzo dei tassi', cls: { bond: -.10, re: -.10, equity: -.08 }, fx: {} }
};
function applyPreset(key) {
  const P = PRESETS[key]; UI.scen = key; UI.shock = { cls: {}, fx: {} };
  for (const [lab] of exposure('class')) { const k = clsKey(lab); UI.shock.cls[lab.toLowerCase()] = (k && P.cls[k]) || 0; }
  for (const [c] of exposure('ccy')) if (c !== 'EUR') UI.shock.fx[c] = P.fx[c] || 0;
}
function runScenario() {
  const sh = UI.shock, cs = l => sh.cls[l.toLowerCase()] || 0, fs = c => (c && c !== 'EUR' ? sh.fx[c] : 0) || 0;
  const eff = (l, c) => (1 + cs(l)) * (1 + fs(c)) - 1;
  return S.accounts.map(a => {
    const cash = accCash(a); let val = cash, d = cash * eff('Liquidità', a.cashCcy);
    for (const p of a.positions) { const i = inst(p.instId); if (!i) continue; const v = posValue(p); val += v; for (const [k, w] of parseMix(i.cls, 'Non classificato')) d += v * w * eff(k, i.ccy); }
    return { a, val, d };
  });
}

/* ============ form generico ============ */

  const isNum = Array.from({ length: nc }, (_, c) => { const vs = body.map(r => String(r[c] ?? '').trim()).filter(Boolean); return vs.length > 0 && vs.every(v => looksNumeric(v) && !parseDate(v, 'dmy')); });

/* ============ più file in un colpo: scegli tutti i file, poi li controlli uno alla volta ============ */
const NAME_STOP = new Set(['conto', 'csv', 'xlsx', 'txt', 'export', 'file', 'portafoglio']);

  if (best) return best;

  for (const a of S.accounts) { const sc = nameTokens(a.name).filter(t => ft.has(t)).length; if (sc > top) { top = sc; pick = a; tie = false; } else if (sc === top && sc > 0) tie = true; }
  return top > 0 && !tie ? pick : null;
}

    if (fs.length > 30) { alert('Scegli al massimo 30 file alla volta.'); return; }
    const items = [];
    for (const f of fs) {
      if (/\.(xlsx?|pdf)$/i.test(f.name)) { items.push({ name: f.name, bad: 'Formato non leggibile qui: apri il file in Excel e salvalo come CSV (UTF-8).' }); continue; }
      if (f.size > 20e6) { items.push({ name: f.name, bad: 'File troppo grande.' }); continue; }
      const buf = await f.arrayBuffer();
      items.push({ name: f.name, text: decodeBytes(buf), hash: b64(new Uint8Array(await crypto.subtle.digest('SHA-256', buf))) });

/* ---- conti deposito e vincolati: interessi semplici maturati, al netto della ritenuta ---- */
function depValue(dp, onDate) {

  const d1 = dayMs(onDate || today()), d0 = dayMs(dp.start || today()), dEnd = dp.end ? dayMs(dp.end) : Infinity;
  const days = Math.max(0, (Math.min(d1, dEnd) - d0) / 864e5);

}

/* ---- storico dei prezzi: lettura, serie del valore, variazioni ---- */
function parseHistory(text) {
  const byKey = new Map();

    for (const key of [f[1].toLowerCase(), f[2].toLowerCase()]) { if (!key) continue; if (!byKey.has(key)) byKey.set(key, new Map()); byKey.get(key).set(f[5], p); }      // per ogni giorno vale l'ultimo prezzo letto
  }

  return out;
}
function seriesOf(i) {
  const own = (i.hist || []).map(x => [x.d, x.p]);
  const h2 = DATA.hist && (DATA.hist.get(i.name.toLowerCase()) || (i.code && DATA.hist.get(i.code.toLowerCase())));
  const m = new Map(own); if (h2) for (const x of h2) m.set(x.d, x.p);

}
function priceAtS(s, fallback, d) {

  return s[lo].p;
}
function valueSeries(accs) {              // valore dei conti nel tempo con le quantita' di oggi (non conosce acquisti e vendite passati)
  const held = new Map();
  for (const a of accs) for (const p of a.positions) { const i = inst(p.instId); if (i) held.set(i.id, (held.get(i.id) || 0) + p.qty); }
  const ser = new Map(), dates = new Set([today()]);
  for (const id of held.keys()) { const s = seriesOf(inst(id)); ser.set(id, s); for (const x of s) if (x.d <= today()) dates.add(x.d); }
  const cashFixed = accs.reduce((t, a) => t + (a.dep ? 0 : accCash(a)), 0);
  return [...dates].sort().map(d => {
    let v = cashFixed + accs.reduce((t, a) => t + (a.dep ? depValue(a.dep, d) : 0), 0);
    for (const [id, q] of held) { const i = inst(id); v += q * (d === today() ? i.price : priceAtS(ser.get(id), i.price, d)) * (fxRate(i.ccy) ?? 1); }
    return { d, t: dayMs(d), v };
  });
}
const isoOf = t => { const x = new Date(t); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };

}

  const accs = S.accounts.filter(a => a.perf); if (!accs.length) return null;
  const pts = valueSeries(accs); if (pts.length < 2) return null;
  const n = pts.length, d1 = pts[n - 1].v - pts[n - 2].v, d7 = deltaFrom(pts, 7);

/* ---- simulazione dell'obiettivo (ipotesi di classe, non previsioni) ---- */
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function assumptions() { return Object.assign({}, CLASS_DEFAULT, G().assume || {}); }
function portfolioAssumptions() {
  const ex = exposure('class'), tot = ex.reduce((t, x) => t + x[1], 0) || 1, A = assumptions();
  let mu = 0; const comps = [];
  for (const [lab, v] of ex) { const key = Object.keys(A).find(k => k.toLowerCase() === lab.toLowerCase()) || 'Non classificato', [m, sg] = A[key], w = v / tot; mu += w * m; comps.push({ w, sg, safe: /liquid|monetar/i.test(key) }); }
  let varp = 0; for (let a = 0; a < comps.length; a++) for (let b = 0; b < comps.length; b++) varp += comps[a].w * comps[b].w * comps[a].sg * comps[b].sg * (a === b ? 1 : (comps[a].safe || comps[b].safe ? 0 : 0.5));
  return { mu: mu / 100, sigma: Math.sqrt(varp) / 100 };
}
function simulate(w0, monthly, years, mu, sigma, g) {
  const N = 3000, T = Math.max(1, Math.round(years)), rnd = mulberry(20261029), c = monthly * 12;
  const s2 = Math.log(1 + (sigma / (1 + mu)) ** 2), mm = Math.log(1 + mu) - s2 / 2, ss = Math.sqrt(s2);
  const cols = Array.from({ length: T + 1 }, () => new Float64Array(N));
  for (let n = 0; n < N; n++) { let w = w0; cols[0][n] = w; for (let y = 1; y <= T; y++) { w = (w + c) * Math.exp(mm + ss * gauss(rnd)); cols[y][n] = w; } }
  const pc = (arr, q) => { const a = Float64Array.from(arr).sort(); return a[Math.min(N - 1, Math.floor(q * N))]; };
  const fan = { p10: [], p50: [], p90: [], tgt: [] }; let tw = w0;
  for (let y = 0; y <= T; y++) { fan.p10.push(pc(cols[y], 0.1)); fan.p50.push(pc(cols[y], 0.5)); fan.p90.push(pc(cols[y], 0.9)); if (y > 0) tw = (tw + c) * (1 + g); fan.tgt.push(tw); }

  return { T, fan, target, pTarget: fin2.filter(v => v >= target).length / N, pLoss: fin2.filter(v => v < paid).length / N, p10: fan.p10[T], p50: fan.p50[T], p90: fan.p90[T], paid };
}

/* ---- regole e allarmi ---- */
function alerts() {
  const out = [], tot = totalValue(); if (!(tot > 0)) return out;
  const agg = new Map();
  for (const a of S.accounts) for (const p of a.positions) { const i = inst(p.instId); if (i) agg.set(i.id, (agg.get(i.id) || 0) + posValue(p)); }
  for (const [id, v] of agg) {
    const i = inst(id), w = v / tot;
    if (kindOf(i) === 'azione' && w * 100 > th('maxPos')) out.push('«' + i.name + '» pesa il ' + pct(w) + ' del patrimonio: oltre la soglia del ' + th('maxPos') + '% per un singolo titolo.');
    else if (w * 100 > th('maxAny')) out.push('«' + i.name + '» pesa il ' + pct(w) + ': oltre la soglia del ' + th('maxAny') + '% per una singola posizione.');
  }
  const ex = exposure('class'), cr = ex.filter(([l]) => /crypto/i.test(l)).reduce((t, x) => t + x[1], 0) / tot;
  if (cr * 100 > th('maxCrypto')) out.push('Le crypto valgono il ' + pct(cr) + ': oltre la soglia del ' + th('maxCrypto') + '%.');
  const cash = S.accounts.filter(a => ['broker', 'crypto', 'trading'].includes(a.type)).reduce((t, a) => t + accCash(a), 0) / tot;
  if (cash * 100 > th('maxCash')) out.push('Liquidità ferma nei conti d\'investimento: ' + pct(cash) + ' del patrimonio (soglia ' + th('maxCash') + '%).');
  if (S.policy.target && S.policy.target.trim()) { const cur = new Map(ex.map(([l, v]) => [l.toLowerCase(), v / tot])); for (const [k, w] of parseMix(S.policy.target, 'Non classificato')) { const d = ((cur.get(k.toLowerCase()) || 0) - w) * 100; if (Math.abs(d) > th('tol')) out.push('«' + k + '»: ' + (d > 0 ? '+' : '') + nfp.format(d) + ' punti rispetto all\'obiettivo (soglia ±' + th('tol') + ').'); } }
  const unc = ex.filter(([l]) => /non classificat/i.test(l)).reduce((t, x) => t + x[1], 0) / tot; if (unc > 0.1) out.push('Il ' + pct(unc) + ' del patrimonio è "Non classificato": completa le classi in Strumenti.');
  const lev = [...agg.keys()].map(inst).filter(i => LEV_RE.test(i.name) || i.lev); if (lev.length) out.push('Possibili prodotti con leva o inversi: ' + lev.map(i => i.name).join(', ') + '. Controlla la struttura.');
  return out;
}

  for (let k = 6; k >= 0; k--) { const f = (0.9 + 0.1 * (6 - k) / 6) * (1 + 0.012 * Math.sin(k * 2)); D.snapshots.push({ date: ago(k * 30), total: curTot - curPerf + curPerf * f, perf: curPerf * f, accs: {} }); }
  S = keep; D.policy = { horizon: '20', maxLoss: '25', target: 'Azioni 65, Obbligazioni 20, Crypto 5, Liquidità 10', notes: '' };
  return D;
}

render();
</script>
